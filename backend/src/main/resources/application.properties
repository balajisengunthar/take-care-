# ========================================
# FORGIVE ME — Application Properties
# ========================================

server.port=8080

# ---- H2 In-Memory Database ----
spring.datasource.url=jdbc:h2:mem:forgivemedb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- Email (Gmail SMTP) ----
# CHANGE THESE to your Gmail credentials
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_GMAIL@gmail.com
spring.mail.password=YOUR_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ---- App Settings ----
# Your email (where notifications are sent TO)
app.notify.email=YOUR_GMAIL@gmail.com

# CallMeBot WhatsApp API
# 1. Save +34 644 29 97 85 in your contacts
# 2. Send "I allow callmebot to send me messages" to that number on WhatsApp
# 3. You'll receive your apikey in WhatsApp
app.callmebot.phone=YOUR_WHATSAPP_PHONE_WITH_COUNTRY_CODE
app.callmebot.apikey=YOUR_CALLMEBOT_API_KEY

# ---- JWT ----
app.jwt.secret=ForgiveMeSecretKey2024SuperLongSecretForSigning123456789
app.jwt.expiration-ms=86400000

# ---- Seed Users ----
# These users are pre-loaded on startup
app.users.sender.name=Bala
app.users.sender.password=bala123
app.users.receiver.name=Her
app.users.receiver.password=her123
